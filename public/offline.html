<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b0f14" />
    <title>Sin conexión · The One Percent</title>
    <style>
      :root { color-scheme: dark; --bg: #0b0f14; --fg: #e8edf2; --muted: #9aa6b2; --line: #243040; --accent: #b9f26b; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 26rem; text-align: center; }
      h1 { font-size: 1.375rem; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 20px; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
      a, button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 12px; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
      a { background: var(--accent); color: #0b0f14; border: 0; }
      button { background: transparent; color: var(--fg); border: 1px solid var(--line); }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>Esta pantalla todavía no está preparada para abrirse sin red. Tus datos guardados en este dispositivo siguen a salvo.</p>
      <div class="actions">
        <a href="/">Ir al inicio</a>
        <button type="button" onclick="location.reload()">Reintentar</button>
      </div>
    </main>
  </body>
</html>

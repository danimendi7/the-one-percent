name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

      # Ephemeral local Supabase inside the runner (no cloud project, no secrets).
      - run: npx supabase start -x studio,imgproxy,vector,logflare,edge-runtime,storage-api
      - name: Write local env for the build
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$(npx supabase status -o json | jq -r .API_URL)" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(npx supabase status -o json | jq -r .PUBLISHABLE_KEY)" >> .env.local
      - run: npm run test:integration

      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "true"
      - run: npm run smoke
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
